name: Storico prezzi giornaliero

on:
  schedule:
    - cron: "17 6 * * *"   # ogni giorno alle 06:17 UTC, dopo l'aggiornamento prezzi di Scryfall
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot.mjs
      - name: Commit storico
        run: |
          git config user.name "mtg-invest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Storico prezzi $(date -u +%F)"
          git push
